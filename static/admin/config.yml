# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: webOSArchive/pivotce.com
  branch: main
  # Our own OAuth relay (see the nginx block in DEPLOY.md). Sveltia calls
  # <base_url>/auth; the relay handles /callback.
  base_url: https://www.webosarchive.org/pivot/oauth

# Contributors without write access get a pull request instead of a commit.
publish_mode: editorial_workflow

# Kept off the images/ tree so new uploads never mix with the 613 mirrored
# originals from the rescue.
media_folder: static/uploads
public_folder: /uploads

collections:
  - name: posts
    label: Articles
    label_singular: Article
    folder: content/posts
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    preview_path: '{{year}}/{{month}}/{{day}}/{{fields.slug}}'
    summary: '{{title}}  —  {{author}}, {{year}}'
    sortable_fields: [date, title, author]
    view_filters:
      - { label: Rescued archive, field: archived, pattern: true }
      - { label: Written since,   field: archived, pattern: false }
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, format: "YYYY-MM-DDTHH:mm:ss[Z]", picker_utc: true }
      - { label: Author, name: author, widget: string, hint: 'Display name, e.g. "Alan Morford"' }
      - { label: Author slug, name: author_slug, widget: string, required: false }
      # A fixed vocabulary, so pick from it rather than retyping it. The bare
      # list widget this replaced was free text: a value typed but not committed
      # in the UI saved as `categories: []` with no warning, and the article then
      # appeared under no category at all. A select cannot be left half-entered,
      # and it also rules out the case drift ("news" vs "News") that would split
      # a category in two. Options are the eight already in use across the
      # archive -- add to this list when a genuinely new section is wanted.
      - { label: Categories, name: categories, widget: select, multiple: true,
          required: false,
          options: [News, Tips, Tutorial, Reviews, Editorial, Interview, pivotCE, Contests],
          hint: 'Broad section. Most articles are News.' }
      # Tags stay free text: they are specific and open-ended (TouchPad, LuneOS,
      # ACL), so a fixed option list would be wrong here.
      - { label: Tags, name: tags, widget: list, required: false }
      - { label: Summary, name: summary, widget: text, required: false,
          hint: 'Shown on the front page and in RSS.' }
      - { label: Featured image, name: featured_image, widget: image, required: false }
      - { label: URL slug, name: slug, widget: string, required: false,
          hint: 'Leave blank to derive it from the title.' }
      # Markdown, not richtext: the site builds with Goldmark unsafe=false, so
      # raw HTML would be silently dropped at render time.
      - { label: Body, name: body, widget: markdown }
      # Present and true on the 279 rescued posts; false on anything new.
      - { label: Rescued from the original site, name: archived, widget: boolean,
          default: false, required: false }
      - { label: Original URL, name: source_url, widget: string, required: false }
      - { label: WordPress ID, name: wordpress_id, widget: number, required: false }
      - { label: Last modified, name: lastmod, widget: datetime, required: false,
          format: "YYYY-MM-DDTHH:mm:ss[Z]", picker_utc: true }
      - { label: Comment thread, name: comment_page, widget: string, required: false,
          hint: 'Filename of the archived thread in content/comments/. Leave blank.' }
      - { label: Featured image source, name: featured_image_source, widget: string, required: false }

  - name: pages
    label: Pages
    label_singular: Page
    folder: content/pages
    create: true
    slug: '{{slug}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, format: "YYYY-MM-DDTHH:mm:ss[Z]", picker_utc: true }
      - { label: URL slug, name: slug, widget: string, required: false }
      - { label: Body, name: body, widget: markdown }
      - { label: Rescued from the original site, name: archived, widget: boolean, default: false, required: false }
      - { label: Original URL, name: source_url, widget: string, required: false }
